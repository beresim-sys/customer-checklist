<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה ומעקב הפקת ספר ללקוח</title>
    <!-- Google Font Rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rubik', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf8f2',
                            100: '#fbeee0',
                            200: '#f6dcc0',
                            300: '#efc193',
                            400: '#e69e62',
                            500: '#d97836',
                            600: '#ca602a',
                            700: '#a84c24',
                            800: '#863e22',
                            900: '#6d341f',
                            955: '#3b180f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for tabs navigation */
        .tabs-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .tabs-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
        
        /* Print Styles - optimized for professional PDF export */
        #print-view {
            display: none;
        }
        @media print {
            body {
                background-color: white !important;
                color: black !important;
                font-size: 12px;
            }
            #screen-view {
                display: none !important;
            }
            #print-view {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #e2e8f0 !important;
                margin-bottom: 1.5rem !important;
                page-break-inside: avoid;
                border-radius: 12px;
                overflow: hidden;
            }
            .print-table {
                width: 100%;
                border-collapse: collapse;
            }
            .print-table th, .print-table td {
                border-bottom: 1px solid #e2e8f0;
                padding: 8px 12px;
                text-align: right;
            }
            .print-table th {
                background-color: #f8fafc;
                font-weight: bold;
            }
            input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border: 1.5px solid #000 !important;
                border-radius: 3px;
                position: relative;
                display: inline-block;
                vertical-align: middle;
            }
            input[type="checkbox"]:checked::after {
                content: "✓";
                font-size: 12px;
                font-weight: bold;
                position: absolute;
                top: -2px;
                right: 2px;
                color: black;
            }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Screen view containing the interactive web app -->
    <div id="screen-view" class="flex-grow flex flex-col">
        <!-- Header Section -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                
                <!-- Logo & App Title -->
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                        <i class="fa-solid fa-square-poll-horizontal text-xl"></i>
                    </div>
                    <div>
                        <!-- Dynamic project title -->
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight" id="header-project-title">חיי שרה</h1>
                        <p class="text-xs text-slate-500 font-medium">לוח בקרה להתקדמות כתיבה ועריכה</p>
                    </div>
                </div>

                <!-- Overall Progress in Header -->
                <div class="flex items-center gap-3 w-full sm:w-auto max-w-xs flex-grow justify-end">
                    <div class="text-left hidden sm:block">
                        <span class="text-xs text-slate-400 font-semibold block">התקדמות כללית</span>
                        <span class="text-sm font-bold text-slate-700" id="header-progress-percent">0%</span>
                    </div>
                    <div class="w-24 bg-slate-100 rounded-full h-3 overflow-hidden shadow-inner hidden sm:block">
                        <div id="header-progress-bar" class="bg-gradient-to-l from-brand-600 to-emerald-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                    
                    <!-- Print Button -->
                    <button onclick="printChecklist()" class="bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 font-semibold text-xs px-3.5 py-2 rounded-lg inline-flex items-center gap-1.5 transition shrink-0">
                        <i class="fa-solid fa-print text-slate-500"></i>
                        <span>הדפסה ל-PDF</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Dynamic Navigation Tabs Bar -->
        <div class="bg-white border-b border-slate-200 sticky top-[73px] z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between gap-4">
                    <!-- Tabs container with horizontal scroll support on mobile -->
                    <nav id="tabs-navigation" class="flex space-x-8 space-x-reverse overflow-x-auto tabs-scrollbar py-1 flex-grow">
                        <!-- Populated dynamically by JS -->
                    </nav>
                    
                    <!-- Add Phase Tab-like Button -->
                    <button onclick="promptAddNewPhase()" class="text-slate-400 hover:text-brand-600 font-semibold text-sm py-4 px-2 shrink-0 border-b-2 border-transparent hover:border-brand-400 transition" title="הוסף שלב עבודה חדש">
                        <i class="fa-solid fa-plus-circle text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Tab Content Container -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div id="tab-content" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 min-h-[400px]">
                <!-- Populated dynamically based on activeTabId -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 py-6 mt-12">
            <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400 font-sans">
                לוח בקרה להתקדמות הפקת ספרים © 2026. כל הזכויות שמורות.
            </div>
        </footer>
    </div>


    <!-- PRINT VIEW (Only visible when printing / converting to PDF) -->
    <div id="print-view">
        <!-- Print Header -->
        <div class="border-b-2 border-slate-900 pb-4 mb-6">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-bold" id="print-project-header">חיי שרה</h1>
                    <p class="text-sm text-slate-500">לוח בקרה ומעקב התקדמות הפקת ספר</p>
                    <p class="text-xs text-slate-400 mt-1" id="print-date"></p>
                </div>
                <div class="text-left">
                    <span class="text-sm font-semibold">אחוז התקדמות כללי: </span>
                    <span class="text-lg font-bold text-brand-700" id="print-progress-val">0%</span>
                </div>
            </div>
        </div>

        <!-- Print Customer Info Section -->
        <div class="print-card bg-slate-50 p-4 mb-6">
            <h3 class="text-sm font-bold text-slate-800 border-b border-slate-200 pb-2 mb-3">פרטי לקוח ואיש קשר</h3>
            <div class="grid grid-cols-3 gap-4 text-xs">
                <div>
                    <span class="text-slate-500 block">לקוח:</span>
                    <span class="font-bold text-slate-900" id="print-client-name">-</span>
                </div>
                <div>
                    <span class="text-slate-500 block">טלפון:</span>
                    <span class="font-bold text-slate-900" id="print-client-phone">-</span>
                </div>
                <div>
                    <span class="text-slate-500 block">אימייל:</span>
                    <span class="font-bold text-slate-900" id="print-client-email">-</span>
                </div>
            </div>
        </div>

        <!-- Print Stages Container (Fully rendered sequentially) -->
        <div id="print-phases-list" class="space-y-6">
            <!-- Populated dynamically on print trigger -->
        </div>
    </div>


    <!-- JavaScript State & Logic -->
    <script>
        // Default initial application state
        const defaultState = {
            clientName: "חיי שרה",
            clientPhone: "050-0000000",
            clientEmail: "client@example.com",
            phases: [
                {
                    id: "phase-1",
                    title: "שלב א': התקשרות עם לקוח",
                    tasks: [
                        { id: "task-1-1", title: "ראיון זום עם הלקוח", completed: false, dueDate: "", notes: "פגישת אפיון והגדרת קונספט לספר." },
                        { id: "task-1-2", title: "קבלת מקדמה", completed: false, dueDate: "", notes: "הסדרת תשלום מקדמה ותיאום הסכם עבודה." },
                        { id: "task-1-3", title: "פתיחת מחברת לקוח", completed: false, dueDate: "", notes: "הקמת תיקיה ללקוח וריכוז פרטים ראשוניים." },
                        { id: "task-1-4", title: "קבלת חומרי רקע נוספים מהלקוח", completed: false, dueDate: "", notes: "איסוף חומרים, תמונות וקבצי טקסט ראשוניים מהלקוח." }
                    ]
                },
                {
                    id: "phase-2",
                    title: "שלב ב': תחקיר",
                    tasks: [
                        { id: "task-2-1", title: "הפעלת רנית", completed: false, dueDate: "", notes: "" },
                        { id: "task-2-2", title: "ביצוע תחקיר עומק", completed: false, dueDate: "", notes: "" },
                        { id: "task-2-3", title: "ניתוח מסמכים ותמונות בג'מיני", completed: false, dueDate: "", notes: "" },
                        { id: "task-2-4", title: "הפעלת תמי לניתוח שפת גוף וקול", completed: false, dueDate: "", notes: "" },
                        { id: "task-2-5", title: "הפעלת צוות העריכה הראשונית של טלי", completed: false, dueDate: "", notes: "" }
                    ]
                },
                {
                    id: "phase-3",
                    title: "שלב ג': עריכה והגהה",
                    tasks: [
                        { id: "task-3-1", title: "עריכה ספרותית ומבנית לטיוטה המלאה", completed: false, dueDate: "", notes: "שיפור זרימת העלילה/התוכן, ארגון מחדש של פרקים במידת הצורך." },
                        { id: "task-3-2", title: "עריכה לשונית וסגנונית", completed: false, dueDate: "", notes: "תיקון ניסוחים, זמנים, והאחדת סגנון הכתיבה." },
                        { id: "task-3-3", title: "הגהה סופית ותיקון שגיאות כתיב ופיסוק", completed: false, dueDate: "", notes: "" },
                        { id: "task-3-4", title: "אישור לקוח לטקסט הסופי לפני התחלת עימוד", completed: false, dueDate: "", notes: "חתימת הלקוח על הטקסט הסופי. לאחר שלב זה לא יוכנסו שינויי נוסח." }
                    ]
                },
                {
                    id: "phase-4",
                    title: "שלב ד': עימוד ועיצוב גרפי",
                    tasks: [
                        { id: "task-4-1", title: "עיצוב סקיצות לכריכה (קדמית, גב ושידרה)", completed: false, dueDate: "", notes: "שליחת 2-3 סקיצות שונות לבחירת הלקוח." },
                        { id: "task-4-2", title: "עימוד פנים של הספר (בחירת גופנים, שוליים, מרווחים)", completed: false, dueDate: "", notes: "" },
                        { id: "task-4-3", title: "שילוב תמונות, איורים וטבלאות בתוך העימוד", completed: false, dueDate: "", notes: "" },
                        { id: "task-4-4", title: "הגהה של קובץ הספר המעומד", completed: false, dueDate: "", notes: "חיפוש שורות יתומות, שבירות מילים לא נכונות או תקלות גרפיות." },
                        { id: "task-4-5", title: "קבלת אישור סופי של הלקוח לקובץ ה-PDF לדפוס", completed: false, dueDate: "", notes: "" }
                    ]
                },
                {
                    id: "phase-5",
                    title: "שלב ה': הפקה, הדפסה והפצה",
                    tasks: [
                        { id: "task-5-1", title: "רישום הספר וקבלת מסת\"ב (ISBN) ודאנאקוד", completed: false, dueDate: "", notes: "הסדרת הרישום הרשמי מול בית הספרים הלאומי." },
                        { id: "task-5-2", title: "סגירת קבצים מותאמים לדפוס (הצלבות צבעים ובלידים)", completed: false, dueDate: "", notes: "" },
                        { id: "task-5-3", title: "הדפסת עותק ניסיון (העתק שמש) ואישורו על ידי הלקוח", completed: false, dueDate: "", notes: "בדיקת איכות פיזית של הצבעים והנייר לפני הדפסת המהדורה כולה." },
                        { id: "task-5-4", title: "הדפסה וכריכה של המהדורה המלאה בבית הדפוס", completed: false, dueDate: "", notes: "" },
                        { id: "task-5-5", title: "הפקת קובץ דיגיטלי (EPUB) להפצה מקוונת", completed: false, dueDate: "", notes: "" },
                        { id: "task-5-6", title: "מסירה/משלוח של הספרים ללקוח וסגירת חשבון", completed: false, dueDate: "", notes: "" }
                    ]
                }
            ]
        };

        // Application State
        let appState = null;
        // Tracking active tab (default is 'client-details')
        let activeTabId = "client-details";
        // Expanded task notes tracker
        let expandedNotes = {};

        // Load data from LocalStorage or initialize default
        function initApp() {
            const stored = localStorage.getItem("customerBookChecklist");
            let useDefault = true;
            if (stored) {
                try {
                    appState = JSON.parse(stored);
                    if (appState.phases && Array.isArray(appState.phases) && appState.phases.length > 0) {
                        // Check if it's the old default state (contains old task 1, old Phase 1 title, old Phase 2 title, or missing new Phase 2 tasks)
                        const hasOldTask1 = appState.phases[0].tasks.some(t => t.title === "פגישת אפיון והגדרת קונספט לספר");
                        const hasOldPhase1Title = appState.phases[0].title === "שלב א': תכנון, אפיון והתקשרות";
                        const hasOldPhase2 = appState.phases.length > 1 && appState.phases[1].title === "שלב ב': כתיבה ואיסוף חומרים";
                        const missingTask2_5 = appState.phases.length > 1 && !appState.phases[1].tasks.some(t => t.title === "הפעלת צוות העריכה הראשונית של טלי");
                        if (!hasOldTask1 && !hasOldPhase1Title && !hasOldPhase2 && !missingTask2_5) {
                            useDefault = false;
                        }
                    }
                } catch (e) {
                    console.error("Error parsing stored data", e);
                }
            }
            if (useDefault) {
                appState = JSON.parse(JSON.stringify(defaultState));
            }

            // Load active tab from localStorage if exists
            const storedTab = localStorage.getItem("activeTabId");
            if (storedTab) {
                activeTabId = storedTab;
            }

            saveAndRender();
        }

        // Save state to localstorage and re-render navigation + active content
        function saveAndRender() {
            localStorage.setItem("customerBookChecklist", JSON.stringify(appState));
            localStorage.setItem("activeTabId", activeTabId);

            // Sync Header Project Name
            document.getElementById("header-project-title").innerText = appState.clientName || "פרויקט ללא שם";
            
            updateProgressPercentage();
            renderTabs();
            renderActiveTabContent();
            renderPrintView();
        }

        // Calculate and update progress indicators
        function updateProgressPercentage() {
            let total = 0;
            let completed = 0;

            appState.phases.forEach(p => {
                total += p.tasks.length;
                completed += p.tasks.filter(t => t.completed).length;
            });

            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            // Header progress
            document.getElementById("header-progress-percent").innerText = `${percent}%`;
            document.getElementById("header-progress-bar").style.width = `${percent}%`;
            
            // Print progress
            document.getElementById("print-progress-val").innerText = `${percent}%`;
        }

        // Switch active tab
        function setActiveTab(tabId) {
            activeTabId = tabId;
            saveAndRender();
        }

        // Render Tabs Navigation Row
        function renderTabs() {
            const nav = document.getElementById("tabs-navigation");
            
            // Client details tab template
            const clientActive = activeTabId === "client-details";
            let tabsHtml = `
                <button onclick="setActiveTab('client-details')" class="flex items-center gap-2 py-4 px-1 border-b-2 font-semibold text-sm shrink-0 transition ${clientActive ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}">
                    <i class="fa-solid fa-user-tie text-base"></i>
                    <span>פרטי לקוח</span>
                </button>
            `;

            // Loop phases and build tabs
            appState.phases.forEach(phase => {
                const isActive = activeTabId === phase.id;
                const total = phase.tasks.length;
                const completed = phase.tasks.filter(t => t.completed).length;
                const isAllCompleted = total > 0 && total === completed;

                tabsHtml += `
                    <button onclick="setActiveTab('${phase.id}')" class="flex items-center gap-2 py-4 px-1 border-b-2 font-semibold text-sm shrink-0 transition ${isActive ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}">
                        <span>${escapeHtml(phase.title)}</span>
                        <span class="text-xs px-1.5 py-0.5 rounded-full ${isAllCompleted ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                            ${completed}/${total}
                        </span>
                    </button>
                `;
            });

            nav.innerHTML = tabsHtml;
        }

        // Render Active Tab Content Area
        function renderActiveTabContent() {
            const contentDiv = document.getElementById("tab-content");

            if (activeTabId === "client-details") {
                // Client details tab view
                contentDiv.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                        <!-- Left Panel: Client Info Form -->
                        <div class="md:col-span-6 space-y-6">
                            <h2 class="text-xl font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
                                <i class="fa-solid fa-address-card text-brand-600"></i>
                                <span>כרטיס פרטי לקוח</span>
                            </h2>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">שם הלקוח / הפרויקט</label>
                                    <input type="text" id="client-name-input" value="${escapeHtml(appState.clientName)}" onchange="updateClientField('name', this.value)" class="w-full bg-slate-50 hover:bg-slate-100/50 focus:bg-white border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 outline-none transition font-sans" placeholder="למשל: חיי שרה">
                                </div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">מספר טלפון ליצירת קשר</label>
                                    <input type="tel" id="client-phone-input" value="${escapeHtml(appState.clientPhone)}" onchange="updateClientField('phone', this.value)" class="w-full bg-slate-50 hover:bg-slate-100/50 focus:bg-white border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl px-4 py-3 text-sm text-slate-700 outline-none transition" placeholder="למשל: 050-1234567">
                                </div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">כתובת אימייל</label>
                                    <input type="email" id="client-email-input" value="${escapeHtml(appState.clientEmail)}" onchange="updateClientField('email', this.value)" class="w-full bg-slate-50 hover:bg-slate-100/50 focus:bg-white border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl px-4 py-3 text-sm text-slate-700 outline-none transition text-left" style="direction: ltr;" placeholder="example@mail.com">
                                </div>
                            </div>
                        </div>

                        <!-- Right Panel: Overall Statistics & Actions -->
                        <div class="md:col-span-6 flex flex-col justify-between space-y-6">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
                                    <i class="fa-solid fa-chart-pie text-emerald-600"></i>
                                    <span>סטטוס התקדמות מפורט</span>
                                </h2>
                                
                                <div class="mt-4 space-y-3.5" id="detailed-stats-container">
                                    <!-- Populated below -->
                                </div>
                            </div>

                            <!-- Danger and Utility Action Buttons -->
                            <div class="pt-6 border-t border-slate-100 flex flex-wrap gap-2.5">
                                <button onclick="exportBackup()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold text-xs px-4 py-2.5 rounded-lg inline-flex items-center gap-1.5 transition shadow-sm">
                                    <i class="fa-solid fa-download text-slate-400"></i>
                                    <span>ייצוא קובץ גיבוי</span>
                                </button>
                                <label class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold text-xs px-4 py-2.5 rounded-lg inline-flex items-center gap-1.5 transition shadow-sm cursor-pointer">
                                    <i class="fa-solid fa-upload text-slate-400"></i>
                                    <span>ייבוא קובץ גיבוי</span>
                                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
                                </label>
                                <button onclick="confirmReset()" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-xs px-4 py-2.5 rounded-lg inline-flex items-center gap-1.5 border border-red-100 transition mr-auto">
                                    <i class="fa-solid fa-trash-can text-red-400"></i>
                                    <span>איפוס מלא</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                // Render Phase Stats in Client Details
                let statsHtml = "";
                appState.phases.forEach(phase => {
                    const total = phase.tasks.length;
                    const completed = phase.tasks.filter(t => t.completed).length;
                    const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
                    
                    statsHtml += `
                        <div>
                            <div class="flex justify-between text-xs font-semibold mb-1">
                                <span class="text-slate-600">${escapeHtml(phase.title)}</span>
                                <span class="text-slate-800 font-bold">${percent}% (${completed}/${total})</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div class="bg-brand-500 h-full transition-all duration-300" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById("detailed-stats-container").innerHTML = statsHtml || `<p class="text-slate-400 text-sm">אין שלבי עבודה מוגדרים.</p>`;
                
            } else {
                // Phase tasks view
                const activePhase = appState.phases.find(p => p.id === activeTabId);
                if (!activePhase) {
                    // Falls back to details if phase not found
                    activeTabId = "client-details";
                    saveAndRender();
                    return;
                }

                const phaseTotal = activePhase.tasks.length;
                const phaseDone = activePhase.tasks.filter(t => t.completed).length;

                // Template for Phase Card
                let html = `
                    <div class="space-y-6">
                        <!-- Phase Header Title & Delete -->
                        <div class="flex items-center justify-between border-b border-slate-100 pb-4 gap-4">
                            <div class="flex-grow min-w-0">
                                <input type="text" 
                                       value="${escapeHtml(activePhase.title)}"
                                       onchange="updatePhaseTitle('${activePhase.id}', this.value)"
                                       class="font-bold text-slate-800 text-lg sm:text-xl bg-transparent border-b border-transparent hover:border-slate-300 focus:border-brand-500 px-2 py-0.5 rounded outline-none transition focus:bg-white w-full font-sans">
                            </div>
                            
                            <div class="flex items-center gap-3 shrink-0">
                                <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full border border-slate-200">
                                    ${phaseDone} / ${phaseTotal} הושלמו
                                </span>
                                
                                <button onclick="deletePhase('${activePhase.id}')" 
                                        title="מחק שלב זה לגמרי"
                                        class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition">
                                    <i class="fa-solid fa-trash-can text-base"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Sub-steps (Tasks) list -->
                        <div class="divide-y divide-slate-100">
                `;

                if (phaseTotal === 0) {
                    html += `
                        <div class="text-center py-12 text-slate-400 text-sm">
                            <i class="fa-solid fa-list-check text-4xl text-slate-200 mb-3 block"></i>
                            אין עדיין משימות בשלב עבודה זה.
                            <button onclick="addNewTask('${activePhase.id}')" class="text-brand-600 hover:text-brand-700 hover:underline font-bold block mx-auto mt-2">לחץ להוספת משימה ראשונה</button>
                        </div>
                    `;
                } else {
                    activePhase.tasks.forEach(task => {
                        const isCompleted = task.completed;
                        const isPastDue = task.dueDate && new Date(task.dueDate) < new Date() && !isCompleted;

                        html += `
                            <div id="task-row-${task.id}" class="group py-4">
                                <div class="flex items-start justify-between gap-3">
                                    
                                    <!-- Checkbox and Task Title -->
                                    <div class="flex items-start gap-3 flex-grow min-w-0">
                                        <input type="checkbox" 
                                               ${isCompleted ? 'checked' : ''} 
                                               onchange="toggleTask('${activePhase.id}', '${task.id}')"
                                               class="w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500 mt-1 cursor-pointer transition">
                                        
                                        <div class="flex-grow min-w-0">
                                            <!-- Inline editable task title -->
                                            <input type="text" 
                                                   value="${escapeHtml(task.title)}"
                                                   onchange="updateTaskTitle('${activePhase.id}', '${task.id}', this.value)"
                                                   placeholder="שם המשימה..."
                                                   class="w-full bg-transparent border-b border-transparent hover:border-slate-200 focus:border-brand-500 px-1.5 py-0.5 rounded font-medium text-slate-800 outline-none transition focus:bg-white font-sans ${isCompleted ? 'line-through text-slate-400 font-normal' : ''}">
                                        </div>
                                    </div>

                                    <!-- Controls: Date and Actions -->
                                    <div class="flex items-center gap-2 shrink-0">
                                        
                                        <!-- Due Date Badge & Picker -->
                                        <div class="relative flex items-center">
                                            <input type="date" 
                                                   value="${task.dueDate || ''}" 
                                                   onchange="updateTaskDueDate('${activePhase.id}', '${task.id}', this.value)"
                                                   class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-slate-500 focus:outline-none focus:border-brand-500 font-sans ${isPastDue ? 'border-red-300 text-red-600 bg-red-50' : ''}">
                                        </div>

                                        <!-- Delete Task Button -->
                                        <button onclick="deleteTask('${activePhase.id}', '${task.id}')" 
                                                title="מחק משימה"
                                                class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition md:opacity-0 group-hover:opacity-100">
                                            <i class="fa-solid fa-trash-can text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                        </div>

                        <!-- Add task button inside phase -->
                        <div class="pt-4 border-t border-slate-100 flex justify-end">
                            <button onclick="addNewTask('${activePhase.id}')" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs px-4 py-2.5 rounded-lg inline-flex items-center gap-1.5 transition shadow-sm">
                                <i class="fa-solid fa-plus-circle"></i>
                                <span>הוספת תת-שלב (משימה)</span>
                            </button>
                        </div>
                    </div>
                `;

                contentDiv.innerHTML = html;
            }
        }

        // Generate Print-Optimized sequential layout for PDF Export
        function renderPrintView() {
            // Update static info fields
            document.getElementById("print-project-header").innerText = appState.clientName || "פרויקט ללא שם";
            document.getElementById("print-client-name").innerText = appState.clientName || "-";
            document.getElementById("print-client-phone").innerText = appState.clientPhone || "-";
            document.getElementById("print-client-email").innerText = appState.clientEmail || "-";

            const printPhasesDiv = document.getElementById("print-phases-list");
            
            let html = "";
            appState.phases.forEach((phase) => {
                const total = phase.tasks.length;
                const completed = phase.tasks.filter(t => t.completed).length;
                
                let tasksRows = "";
                if (total === 0) {
                    tasksRows = `<tr><td colspan="3" class="text-center text-slate-400 text-xs py-4">אין משימות בשלב זה.</td></tr>`;
                } else {
                    phase.tasks.forEach(task => {
                        const dateFormatted = task.dueDate ? new Date(task.dueDate).toLocaleDateString('he-IL') : "-";
                        tasksRows += `
                            <tr>
                                <td style="width: 40px; text-align: center;">
                                    <input type="checkbox" ${task.completed ? 'checked' : ''} disabled>
                                </td>
                                <td>
                                    <div class="font-semibold text-slate-800">${escapeHtml(task.title)}</div>
                                </td>
                                <td style="width: 110px;" class="text-slate-600 text-xs font-sans">${dateFormatted}</td>
                            </tr>
                        `;
                    });
                }

                html += `
                    <div class="print-card">
                        <div class="bg-slate-100 border-b border-slate-200 px-4 py-2.5 flex justify-between items-center">
                            <span class="font-bold text-slate-800">${escapeHtml(phase.title)}</span>
                            <span class="text-xs font-bold text-slate-600">${completed} / ${total} הושלמו</span>
                        </div>
                        <table class="print-table text-xs">
                            <thead>
                                <tr>
                                    <th style="width: 40px; text-align: center;">בוצע</th>
                                    <th>פרטי המשימה</th>
                                    <th style="width: 110px;">תאריך יעד</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tasksRows}
                            </tbody>
                        </table>
                    </div>
                `;
            });

            printPhasesDiv.innerHTML = html || `<p class="text-center text-slate-400 py-6 text-sm">אין משימות להצגה.</p>`;
        }

        // Toggle state of notes textbox
        function toggleNotesRow(taskId) {
            expandedNotes[taskId] = !expandedNotes[taskId];
            const container = document.getElementById(`notes-container-${taskId}`);
            if (container) {
                container.classList.toggle("hidden");
            }
        }

        // Update client info fields
        function updateClientField(field, value) {
            if (field === 'name') {
                appState.clientName = value.trim() || "חיי שרה";
                document.getElementById("header-project-title").innerText = appState.clientName;
            }
            if (field === 'phone') appState.clientPhone = value.trim();
            if (field === 'email') appState.clientEmail = value.trim();
            
            saveAndRender();
        }

        // Toggle task completed checkbox
        function toggleTask(phaseId, taskId) {
            const phase = appState.phases.find(p => p.id === phaseId);
            if (phase) {
                const task = phase.tasks.find(t => t.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    saveAndRender();
                }
            }
        }

        // Update task title inline
        function updateTaskTitle(phaseId, taskId, newTitle) {
            const phase = appState.phases.find(p => p.id === phaseId);
            if (phase) {
                const task = phase.tasks.find(t => t.id === taskId);
                if (task) {
                    task.title = newTitle.trim() || "משימה ללא שם";
                    saveAndRender();
                }
            }
        }

        // Update task due date
        function updateTaskDueDate(phaseId, taskId, dateString) {
            const phase = appState.phases.find(p => p.id === phaseId);
            if (phase) {
                const task = phase.tasks.find(t => t.id === taskId);
                if (task) {
                    task.dueDate = dateString;
                    saveAndRender();
                }
            }
        }

        // Update task notes textarea
        function updateTaskNotes(phaseId, taskId, notes) {
            const phase = appState.phases.find(p => p.id === phaseId);
            if (phase) {
                const task = phase.tasks.find(t => t.id === taskId);
                if (task) {
                    task.notes = notes;
                    saveAndRender();
                }
            }
        }

        // Add a brand new task inside a phase
        function addNewTask(phaseId) {
            const phase = appState.phases.find(p => p.id === phaseId);
            if (phase) {
                const newId = "task-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
                phase.tasks.push({
                    id: newId,
                    title: "תת-שלב חדש",
                    completed: false,
                    dueDate: "",
                    notes: ""
                });
                
                saveAndRender();
                
                // Focus on the newly created input
                setTimeout(() => {
                    const row = document.getElementById(`task-row-${newId}`);
                    if (row) {
                        const input = row.querySelector('input[type="text"]');
                        if (input) {
                            input.focus();
                            input.select();
                        }
                    }
                }, 50);
            }
        }

        // Delete a task
        function deleteTask(phaseId, taskId) {
            const phase = appState.phases.find(p => p.id === phaseId);
            if (phase) {
                phase.tasks = phase.tasks.filter(t => t.id !== taskId);
                saveAndRender();
            }
        }

        // Update phase title
        function updatePhaseTitle(phaseId, newTitle) {
            const phase = appState.phases.find(p => p.id === phaseId);
            if (phase) {
                phase.title = newTitle.trim() || "שלב ללא שם";
                saveAndRender();
            }
        }

        // Delete a complete phase
        function deletePhase(phaseId) {
            if (confirm("האם אתה בטוח שברצונך למחוק את כל שלב העבודה הזה יחד עם כל תתי-השלבים (המשימות) שבתוכו?")) {
                appState.phases = appState.phases.filter(p => p.id !== phaseId);
                // Fallback tab
                activeTabId = "client-details";
                saveAndRender();
            }
        }

        // Add custom phase to the bottom
        function promptAddNewPhase() {
            const title = prompt("הזן שם עבור שלב העבודה החדש:");
            if (title && title.trim()) {
                const phaseId = "phase-" + Date.now();
                appState.phases.push({
                    id: phaseId,
                    title: title.trim(),
                    tasks: []
                });
                activeTabId = phaseId;
                saveAndRender();
            }
        }

        // Print page helper
        function printChecklist() {
            // Render print date
            const now = new Date();
            document.getElementById("print-date").innerText = `תאריך הפקה: ${now.toLocaleDateString('he-IL')} | שעה: ${now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'})}`;
            window.print();
        }

        // Export state as backup JSON file
        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const downloadAnchor = document.createElement('a');
            
            const sanitizedName = (appState.clientName || 'checklist').replace(/[^a-zA-Z0-9א-ת]/g, '_');
            const dateStr = new Date().toISOString().slice(0, 10);
            
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `checklist_${sanitizedName}_${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Import state from a backup JSON file
        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    // Simple structural validation
                    if (imported.phases && Array.isArray(imported.phases)) {
                        appState = imported;
                        activeTabId = "client-details";
                        saveAndRender();
                        alert("הגיבוי יובא בהצלחה!");
                    } else {
                        alert("קובץ שגוי: מבנה הנתונים אינו תואם לתוכנה.");
                    }
                } catch (err) {
                    alert("שגיאה בקריאת הקובץ. וודא כי מדובר בקובץ JSON תקין.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
            // Clear input so same file can be selected again
            event.target.value = "";
        }

        // Reset system confirm
        function confirmReset() {
            if (confirm("האם אתה בטוח שברצונך לאפס את הלוח? כל המשימות והשלבים המותאמים ופרטי הלקוח יימחקו והמערכת תחזור לברירת המחדל.")) {
                appState = JSON.parse(JSON.stringify(defaultState));
                activeTabId = "client-details";
                expandedNotes = {};
                saveAndRender();
            }
        }

        // Simple HTML Escaping helper
        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
